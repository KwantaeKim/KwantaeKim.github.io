  /* phones and small windows: the dashboard flows at css size and the page scrolls */

  /* phones (a touch screen whose short side is under 520 css px, html.phone): the game is always landscape and fills

  html.phone #overlay.snap { right: var(--snap-r, 30.2%); }   /* the caught card's place, from fit() */

  html.phone #panel .grp { flex-wrap: wrap; row-gap: 8px; }   /* the three mode buttons may take a second line */

      <div class="grp">
        <span>Control</span>
        <label class="pill"><input type="radio" name="ctrl" value="direct" checked><span>Direct</span></label>
        <label class="pill"><input type="radio" name="ctrl" value="p1"><span>+1 pole mode</span></label>
        <label class="pill"><input type="radio" name="ctrl" value="p2"><span>+2 pole mode</span></label>
        <span id="modeBadge" role="status">Loading mode…</span>
      </div>
      <label class="sw"><input type="checkbox" id="rstops"><span class="knob"></span><span>Random stops</span></label>
      <div class="grp off" id="tau1g">
        <span>τ₁</span>
        <input id="tau1" class="tau" type="range" min="0.05" max="1" step="0.05" value="0.5" disabled aria-label="Time constant τ₁">
        <span class="tv" id="tau1Val">0.50 s</span>
      </div>
      <div class="grp off" id="tau2g">
        <span>τ₂</span>
        <input id="tau2" class="tau" type="range" min="0.05" max="1" step="0.05" value="0.5" disabled aria-label="Time constant τ₂">
        <span class="tv" id="tau2Val">0.50 s</span>
      </div>
    </div>
    <div class="row" id="row2">
      <div id="vbar">
        <div class="lbl"><span>↑ Up</span><span class="z">0</span><span>Down ↓</span></div>
        <div class="track"><div class="tick"></div><div id="vfill"></div></div>
      </div>
    </div>
    <!-- classroom mode only: the room's connection status, and the admin's sign-in, restart and sign-out -->
    <div class="row" id="net" hidden>
      <span class="dot" id="netDot"></span><span id="netText">Connecting…</span><span id="netCount" hidden>Online: —</span>
      <span class="grp" id="netAdmin" hidden>
        <button type="button" class="nb" id="restartAll">Restart everyone</button>
        <button type="button" class="nb ghost" id="signOut">Sign out</button></span>
      <button type="button" class="nb ghost" id="adminBtn" hidden>Admin access</button>
    </div>
    <button type="button" class="nb" id="sheetDone">Done</button>   <!-- phones: closes the settings sheet -->
  </div>
  <div id="safe"></div>   <!-- its padding is the screen's safe-area insets, read by fit() -->
  <!-- the teacher's link in a room (?room=<id>&teacher): the class and the room's controls instead of the game -->
  <section id="teach" aria-label="Classroom control">
    <header class="t-top">
      <div class="t-brand"><img id="tMascot" alt=""><div><b>Hide-and-Seek</b></div></div>
      <div class="t-room"><span class="dot" id="tDot"></span><span id="tRoom">Connecting…</span></div>
      <div class="t-who"><button type="button" class="t-btn" id="tSign">Sign in</button></div>
    </header>
    <div class="t-grid">
      <section class="t-card t-class">
        <div class="t-head"><h2>Class</h2><span class="t-round">Round<b id="tRound">–</b></span></div>
        <div class="t-live">
          <div class="t-ring">
            <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="50"/>
              <circle id="tSegA" class="active" cx="60" cy="60" r="50" pathLength="100"/><circle id="tSegW" class="completed" cx="60" cy="60" r="50" pathLength="100"/>
              <circle id="tSegC" class="caught" cx="60" cy="60" r="50" pathLength="100"/><circle id="tSegX" class="waiting" cx="60" cy="60" r="50" pathLength="100"/></svg>
            <div class="t-ringc"><b id="tH">–</b><span id="tHof">connecting…</span></div>
          </div>
          <ul class="t-legend">
            <li><i class="active"></i>Hiding<b id="tLh">–</b></li>
            <li><i class="completed"></i>Completed<b id="tLw">–</b></li>
            <li><i class="caught"></i>Caught<b id="tLc">–</b></li>
            <li><i class="waiting"></i>Waiting<b id="tLx">–</b></li>
          </ul>
        </div>
        <div class="t-tiles" id="tTiles"></div>
        <button type="button" class="t-go" id="tGo"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.2v11.6L14 8z"/></svg>Restart everyone</button>
      </section>
      <div class="t-side">
        <section class="t-card t-ctrl" id="tCtrl">
          <h2>Room controls</h2>
          <div class="t-modes">
            <button type="button" class="t-mode" data-mode="direct"><svg viewBox="0 0 64 28" aria-hidden="true"><path class="ref" d="M2 24H12V5H62"/><path d="M2 24H12V5H62"/></svg>Baseline</button>
            <button type="button" class="t-mode" data-mode="p1"><svg viewBox="0 0 64 28" aria-hidden="true"><path class="ref" d="M2 24H12V5H62"/><path d="M2 24H12C16 12 24 6 62 5.2"/></svg>+1 Pole</button>
            <button type="button" class="t-mode" data-mode="p2"><svg viewBox="0 0 64 28" aria-hidden="true"><path class="ref" d="M2 24H12V5H62"/><path d="M2 24H12C21 24 22 6 36 5.4S52 5 62 5"/></svg>+2 Poles</button>
          </div>
          <label class="t-sl">Seeker speed<output id="tSpV">×2.0</output><input id="tSp" type="range" min="2" max="10" step="0.1" value="2"></label>
          <div class="t-taus">
            <label class="t-sl" id="tT1g">τ₁<output id="tT1V">0.50 s</output><input id="tT1" type="range" min="0.05" max="1" step="0.05" value="0.5"></label>
            <label class="t-sl" id="tT2g">τ₂<output id="tT2V">0.50 s</output><input id="tT2" type="range" min="0.05" max="1" step="0.05" value="0.5"></label>
          </div>
          <label class="t-tg"><input type="checkbox" id="tRs"><span class="knob"></span>Random stops</label>
          <div class="t-lock">Sign in to control the room</div>
        </section>
        <section class="t-card t-best" id="tBest">
          <div class="t-head"><h2>Best hider</h2><button type="button" class="t-btn t-pub" id="tPub" disabled></button></div>
          <div class="t-champ"><svg class="t-trophy" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v3h3.2c.4 0 .8.4.8.8C22 9.6 19.8 12 16.9 12.4A5.6 5.6 0 0 1 13.2 15v3h3.3v2.4h-9V18h3.3v-3a5.6 5.6 0 0 1-3.7-2.6C4.2 12 2 9.6 2 5.8c0-.4.4-.8.8-.8H6V2zm12 5v3.2c1.2-.5 1.9-1.6 2.1-3.2H18zM6 7H3.9c.2 1.6.9 2.7 2.1 3.2V7z"/></svg>
            <div class="t-score"><b id="tBestV">—</b><span id="tBestK">No results yet</span><em id="tBestS"></em></div></div>
          <ol class="t-board" id="tBoard"></ol>
        </section>
      </div>
    </div>
    <canvas id="tConfetti" aria-hidden="true"></canvas>
  </section>
</div>
<dialog id="login">
  <form id="loginForm">
    <h2>Admin access</h2>
    <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
    <label>Password<input id="loginPw" type="password" autocomplete="current-password" required></label>
    <p id="loginErr" role="alert"></p>
    <div class="acts"><button type="button" class="nb ghost" id="loginCancel">Cancel</button><button type="submit" class="nb" id="loginGo">Sign in</button></div>
  </form>
</dialog>

<script>
'use strict';
const W = 960, H = 540, LIMIT = 30;
const BUILD = '2026-11-16 14:47:53';                     // build time, also in <meta name="build">: shows which version is loaded
const META = {"export": 4, "pts": {"eye": [0.0, -120.88], "nose": [32.92, -129.85], "headTop": [-28.26, -149.51], "head": [-15.97, -111.43], "body": [-65.11, -48.77], "tail": [-109.34, -90.54], "hindFeet": [-99.51, -4.55], "frontFeet": [-34.4, -4.55]}, "idle": {"w": 688, "h": 612, "ax": 548.89, "ay": 605.41}};
// classroom mode: ?room=<id> (letters, digits, hyphens) joins a room whose difficulty settings are shared through
// Firebase (see "classroom sync" below). Without a room nothing is loaded or contacted: standalone play as before.
const FIREBASE = {"apiKey": "AIzaSyCVRCwldOZH7yIXmNMRMDgPl4Af0wBeRdc", "authDomain": "bichon-classroom.firebaseapp.com", "databaseURL": "https://bichon-classroom-default-rtdb.europe-west1.firebasedatabase.app", "projectId": "bichon-classroom", "appId": "1:1025316398599:web:adfa3707e64b56f9b16ca2", "adminUid": "7zndbbAsafZ1o9M3HztbghzXmZ93"};          // public web config and the admin's uid, from firebase/config.json at build time
// play.html, the free-play build (tools/build.py): no classroom at all, ?room= and &teacher are ignored
const SOLO = false;
const ROOM = SOLO ? null : (() => { const r = new URLSearchParams(location.search).get('room'); if (r === null) return null;
  const id = r.trim().toLowerCase(); return /^[a-z0-9][a-z0-9-]{0,39}$/.test(id) ? id : ''; })();   // null: standalone, '': invalid
// the teacher's link (?room=<id>&teacher) shows the "Admin access" button, the students' link does not. Only a page
// element: who may change a room is decided by the database rules and the admin's sign-in.
const TEACHER = new URLSearchParams(location.search).has('teacher');
// the teacher's link in a room plays no game: it shows the class and the room's controls (the dashboard, #teach), and it
// never counts as a student, signed in or not
const TEACH = TEACHER && ROOM !== null;
if (TEACH) document.documentElement.classList.add('teach');
const PANEL_H = ROOM === null ? 90 : 120;      // the panel gets a third row (room status, admin controls) in classroom mode
const PLAYER = { x: 770, speed: 290, yMin: 215, yMax: 515, start: 470 };   // the hider, right side
const SEEKER = { x: 170, yMin: 215, yMax: 515 };                            // the seeker, left side
// patrol rate at seeker speed x1 (rad/s), rising linearly over a round: one patrol cycle (down and back up) takes
// 20 s at the start and 12 s at the end; xN divides both by N. x4 (5 s -> 3 s) is about the fastest patrol a player
// moving at 290 px/s can follow with human reaction times (was 0.9 -> 1.5 rad/s at x1, so x4 was out of reach).
// The slider spans x2..x10 (default x2, 2026-11-13, was x0.3..x4 with default x1)
const PATROL = { r0: 2 * Math.PI / 20, r1: 2 * Math.PI / 12 };
const LOOK = PLAYER.x > SEEKER.x ? 1 : -1;          // the seeker looks toward the hider: +1 right, -1 left
const P_FLIP = LOOK > 0, S_FLIP = LOOK < 0;         // the sprites face right unless flipped
const WALL = { x: 480, y1: 187, y2: 347, w: 26 };   // short enough that no fixed spot stays hidden
const VIEW = { half: 1.0, far: 4000 };               // the seeker's view cone: half-angle (rad), ray length
const PTS = ['head', 'eye', 'nose', 'headTop', 'body', 'tail', 'frontFeet', 'hindFeet'];   // gaze priority
// paw-print trails: each dog leaves a print every TRAIL.gap px of logical movement (bounce and hop excluded)
// on its own vertical path (the body centre, as the ribbons before: a print at the feet would stay hidden behind the
// body for 95 px of downward travel), alternately TRAIL.side px left and right of it, toes pointing the way it moved.
// A print fades out over TRAIL.life s from TRAIL.alpha. The shape, in canvas px relative
// to the pad centre with the toes toward +y: the pad's ellipse radii, the toe radius and the centres of the two toes
// on one side of the axis (mirrored for the other two). Both colours are darker than lit and shaded grass alike, so
// the prints differ from the grass in brightness and not only in hue (the hider's trail crosses the shadow wedge)
const TRAIL = { life: 3, gap: 20, side: 6.5, alpha: 0.92, pad: [4.8, 3.9], toe: 2.25, toes: [[2.55, 6.25], [5.95, 4.35]],
  y: META.pts.body[1],
  seeker: { x: SEEKER.x + (S_FLIP ? -1 : 1) * META.pts.body[0], color: 'rgb(20,80,220)' },
  hider: { x: PLAYER.x + (P_FLIP ? -1 : 1) * META.pts.body[0], color: 'rgb(198,64,0)' } };
TRAIL.halfW = Math.max(TRAIL.pad[0], ...TRAIL.toes.map(t => t[0] + TRAIL.toe));   // the print's half width
TRAIL.reach = Math.max(TRAIL.pad[1], ...TRAIL.toes.map(t => t[1] + TRAIL.toe));   // and its longest extent along the path
// detection gauge: fills in CATCH_TIME s of full exposure (slower for partial), and drains in CALM_TIME s only while
// the hider is fully hidden. CALM_TIME 3 s (was 2 s): a hider that sits still is seen for about half of every patrol
// cycle, and at fast patrols a 2 s drain emptied the gauge between sightings, so sitting still could win.
// The catch comes at CATCH_LEVEL (0.5 since 2026-11-13, was 1): same rates, so full exposure is caught in 0.6 s. The
// bar above the seeker and the gaze line show gauge / CATCH_LEVEL, so the catch is a full bar.
const CATCH_TIME = 1.2, CALM_TIME = 3.0, CATCH_LEVEL = 0.5;
const FONT = 'system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage'), field = document.getElementById('field'), row2 = document.getElementById('row2');
const speedBox = document.getElementById('speed'), tUp = document.getElementById('tUp'), tDown = document.getElementById('tDown');
const overlay = document.getElementById('overlay');
const msgEl = document.getElementById('msg'), subEl = document.getElementById('sub'), btn = document.getElementById('btn');
const bestEl = document.getElementById('best'), bestNum = document.getElementById('bestNum'), bestLbl = document.getElementById('bestLbl');

const img = { idle: new Image() };              // the one drawing; walking is this pose with a bounce (dogAnim)
// sprite levels: the embedded sprite holds META.export px per canvas px. Halving it gives the levels for smaller
// device scales, so a dog is never drawn from a sprite more than twice its drawn size (plain bilinear sampling of a
// larger one skips pixels and aliases). Each halving is an exact 2x2 average because the sides are multiples of 2.
const mips = { idle: [] };
function makeLevels(im) {
  const levels = [{ s: META.export, src: im }];
  if (!im.naturalWidth) return levels;
  for (let s = META.export / 2, w = im.naturalWidth, h = im.naturalHeight; s >= 1; s /= 2) {
    w = Math.round(w / 2); h = Math.round(h / 2);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high'; cx.drawImage(levels[levels.length - 1].src, 0, 0, w, h);
    levels.push({ s, src: c });
  }
  return levels;
}
function spriteFor(key, scale) {               // the smallest level with at least `scale` px per canvas px
  let pick = mips[key][0];
  for (const l of mips[key]) if (l.s >= scale) pick = l;
  return pick.src;
}
