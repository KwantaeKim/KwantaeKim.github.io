# Research partners. Single source for the map + side panel in worldmap.html.
# Partners sharing lat/lon are merged into one map pin automatically.
# Order within a continent is the display order in the panel.
# Optional `popup_pad:` is the gap in px between the building and its popup (default 4).
# Optional `bearing:`/`pitch:` override the landing camera (defaults -25 / 55).
# Optional `zoom:` overrides the map's landing zoom for that pin (default 16.5).
# Higher is closer; 17.5 fills the screen with one building, 15 shows a campus.

